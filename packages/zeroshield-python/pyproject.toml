[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "zeroshield"
version = "0.2.0"
description = "ZeroShield consent enforcement — token verification and FastAPI middleware"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "python-jose[cryptography]>=3.3.0",
]

[project.optional-dependencies]
fastapi = ["fastapi>=0.110"]
dev = ["pytest>=8.0", "fastapi>=0.110"]

[tool.setuptools.packages.find]
where = ["."]
include = ["zeroshield*"]
