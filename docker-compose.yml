# Local full stack. From this directory:
#   docker compose up --build
#
# Vertex AI uses your host ADC file (gcloud auth application-default login).
# Override the path if needed:
#   $env:GOOGLE_ADC_HOST="C:\Users\<you>\AppData\Roaming\gcloud\application_default_credentials.json"

services:

  db:
    image: pgvector/pgvector:pg16
    container_name: dpdpa_postgres
    environment:
      POSTGRES_USER: dpdpa
      POSTGRES_PASSWORD: dpdpa
      POSTGRES_DB: dpdpa_shield
    ports:
      # Host 5432 is often taken by a local Postgres. Backend still uses db:5432.
      - "5433:5432"
    volumes:
      - dpdpa_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U dpdpa -d dpdpa_shield" ]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: dpdpa_backend
    env_file:
      - ./backend/.env
    environment:
      DATABASE_URL: postgresql+psycopg2://dpdpa:dpdpa@db:5432/dpdpa_shield
      AI_PROVIDER: vertex
      GOOGLE_APPLICATION_CREDENTIALS: /tmp/gcp-adc.json
      GOOGLE_CLOUD_PROJECT: dpdpashield-500607
      GOOGLE_CLOUD_LOCATION: asia-south1
      VERTEX_MODEL_ID: gemini-2.5-flash
      SHIELD_AI_DOCS_DIR: /app/platform_docs
      BACKEND_CORS_ORIGINS: http://localhost:5173,http://127.0.0.1:5173,http://localhost,http://127.0.0.1,http://localhost:80,http://127.0.0.1:80
      FRONTEND_URL: http://localhost
      BACKEND_PUBLIC_URL: http://localhost:8000
    volumes:
      - ./docs:/app/platform_docs:ro
      - type: bind
        source: ${GOOGLE_ADC_HOST:-${APPDATA}/gcloud/application_default_credentials.json}
        target: /tmp/gcp-adc.json
        read_only: true
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/health')",
        ]
      interval: 15s
      timeout: 5s
      retries: 20
      start_period: 60s

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        VITE_API_BASE_URL: http://localhost:8000/api
    container_name: dpdpa_frontend
    ports:
      - "80:80"
    depends_on:
      - backend

volumes:
  dpdpa_pgdata:
